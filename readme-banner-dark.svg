  </filter>
  <clipPath id="portrait"><rect x="54" y="58" width="510" height="444" rx="14"/></clipPath>
  <pattern id="scan" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="1" fill="#aa9bef" opacity=".10"/></pattern>
</defs>
<rect width="1400" height="560" rx="22" fill="url(#bg)"/>
<rect x="26" y="26" width="1348" height="508" rx="18" fill="none" stroke="#29344b"/>
